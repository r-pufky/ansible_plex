---
###############################################################################
# Feature Flags
###############################################################################
# Executed in numerical order.

# 1. Backup SQLite, Preferences.xml to plex_cfg_backup_d?
#
# Backup existing config, DB, and exit role. plex_cfg_backup_d created if
# non-existent. Services stopped, files backed up, services started.
#
# Plex instances that generate indexed thumbnails (BIF options) may be 100GB+.
#
# Default: False.
plex_flg_backup: false

# 2. Restore SQLite, Preferences.xml?
#
# Restore existing config, DB, and exit role.
#
# Preferences.xml:
# Configuration is applied via plex_cfg_preferences.
#
# Database (SQLite only):
# Restored from latest backup in plex_cfg_backup_d.
#
# Services stopped, files restored, services updated and started.
#
# Default: False.
plex_flg_restore: false

# 3. Run maintenance tasks?
#
# Preform role maintenance tasks including removal of old role versions.
#
# Default: True.
plex_flg_maintenance: true

# 4. Install application?
#
# Creates required default directories, users, install packages, download
# software, set minimal Preferences.xml if not specified, update and start
# services.
#
# Default: True.
plex_flg_install: true

# 5. Set Preferences.xml?
#
# File set using plex_cfg_preferences. Stops service and deploys user
# configuration, updates and starts services.
#
# Default: False.
plex_flg_config: false

# 6. Enable scheduled auto updates?
#
# Schedule based on plex_update_schedule. Entitlement upgrades are done in
# this step.
#
# Default: True.
plex_flg_auto_update: true

# 7. Enable scheduled DB repairs?
#
# Schedule based on plex_repair_schedule.
#
# Default: True.
plex_flg_db_repair: true

###############################################################################
# Service
###############################################################################

# Github access token (DBRepair).
#
# Unauthenticated (anonymous) API requests are heavily restricted to the sum
# total of requests to github from a given IP. Use an access token if
# receiving 403's.
#
# Classic Tokens:
# * settings > developer settings > personal access tokens (classic)
#   * notes: {LABEL APPROPRIATELY}
#   * expiration: {CUSTOM}
#   * scopes: NONE
#
# Fine-grained Tokens:
# * settings > developer settings > personal access tokens (fine-grained)
#   * token name: {LABEL APPROPRIATELY}
#   * expiration: {CUSTOM}
#   * description: {DESCRIPTIVE TEXT}
#   * resource owner: {YOUR ACCOUNT}
#   * repository access: Public Repositories (read-only)
#
# Default: '' (unauthenticated).
#
# Reference:
# * https://docs.github.com/en/authentication
plex_srv_token: ''

# User that Plex will run under.
#
# 'media' will automatically be created using vars/main.yml if required. All
# other accounts are checked for existence.
#
# Default: 'media'.
plex_srv_user: 'media'

# Group that Plex will run under.
#
# 'media' will automatically be created using vars/main.yml if required. All
# other accounts are checked for existence.
#
# Default: 'media'.
plex_srv_group: 'media'

# Maximum number of plugins to run at once. Default: 6.
plex_srv_max_plugin_processes: 6

# Maximum plex process CPU stack size (bytes). Default: 3000.
plex_srv_max_stack_size: 3000

# Temporary file location.
#
# Default location used for transcoding and service files / auto updates.
# Automatically created with service user permissions if needed.
#
# Default: '/tmp'.
plex_srv_tmpdir: '/tmp'

# Enable syslog instead of logging to 'Plex Media Server.log'? Default: True.
plex_srv_use_syslog_enable: true

###############################################################################
# Config
###############################################################################

# Role backup location.
#
# All backup operations for a given role execution are stored locally on
# ansible controller with the format 'YYYY-MM-DDTHHMMSS_{FILE}'.
#
# plex_cfg_backup_d: 'data/plex'
#
# Default: ''
plex_cfg_backup_d: ''

# Plex Preferences.xml to set.
#
# Ansible controller path to source Preferences.xml (treated as a jinja2
# template allowing for ansible variable use). Overwrites existing
# Preferences.xml.
#
# plex_cfg_preferences: 'host_vars/plex.example.com/Preferences.xml'
#
# Default: '' (disabled).
plex_cfg_preferences: ''

###############################################################################
# Auto updates
###############################################################################
# Automatic update script to check for and install updates. Updates will use
# Plex token and update channel from Preferences.xml. When enabled entitlements
# will be checked during role execution. Highly recommended.
#
# Script deployed to /opt/plex/plex_update and must be executed as root user.

# Update schedule (systemd TIME calendar format).
#
# Default: 'weekly' (weekly).
#
# Reference:
# * https://www.freedesktop.org/software/systemd/man/latest/systemd.time.html
plex_update_schedule: 'weekly'

###############################################################################
# Plex DB Repair
###############################################################################
# Database repair utility provided by Plex Linux engineers to automate many of
# the DB maintenance tasks. Highly recommended.
#
# Binary deployed to /opt/plex/DBRepair and must be executed as root user.
#
# Squashed NFS mounted application directories cannot enable automatic DB
# repair without modifying and manually running the script itself.
#
# Reference:
# * https://github.com/ChuckPa/DBRepair

# DBRepair release.
#
# Submit an issue if future versions break role deployment. Only compiled
# binary releases are supported (after 2026-10-16).
#
# Default: 'v26.10.00'.
#
# Reference:
# * https://github.com/ChuckPa/DBRepair/releases
plex_repair_version: 'v26.10.00'

# Repair schedule (systemd TIME calendar format).
#
# Default: 'weekly' (weekly).
#
# Reference:
# * https://www.freedesktop.org/software/systemd/man/latest/systemd.time.html
plex_repair_schedule: 'weekly'

# Set cache age (days).
#
# Specify maximum age for PhotoTranscoder Cache images to be retained.
#
# Default: 30.
plex_repair_cache_age: 30

# DB repair options.
#
# Special Case:
# * Always be sure to use 'exit' for script to end during scheduled tasks.
# * Interactive commands are not recommended to use in scheduled tasks.
# * Always update via role. Interactive updates require manual extraction and
#   binary placements.
#
# Values:
#        stop: Stop Plex Media Server before operations.
#   automatic: Check, Repair/Optimize, and Reindex Database in one step.
#       check: Perform integrity check of database and FTS indexes.
#      vacuum: Remove empty space from database without optimizing.
#      repair: Repair/Optimize databases.
#     reindex: Rebuild database indexes.
#       start: Start Plex Media Server after operations.
#      import: Import watch history from another DB (risky).
#     replace: Replace current databases with newest usable backup copy.
#        show: Show log file.
#      status: Report status of PMS (run-state and databases).
#     history: Show command history of this session.
#      revert: Revert DBs to immediately before history index.
#     expunge: Remove view history of non-existent or expired accounts.
#       prune: Remove old PhotoTranscoder cache & temp files.
#     deflate: Deflate a bloated PMS main database.
#     orphans: Search for and report any orphaned media items.
#      ignore: Ignore duplicate/constraint errors.
#      update: Check for and offer to download updates (Do not use
#              non-interactively).
#      config: Show current Host configuration (debugging/verification).
#        quit: Quit immediately. Keep all temporary files.
#        exit: Exit with cleanup options.
#
# Default:
#   - 'stop'
#   - 'check'
#   - 'repair'
#   - 'reindex'
#   - 'prune'
#   - 'deflate'
#   - 'start'
#   - 'exit'
#
# Reference:
# * https://github.com/ChuckPa/DBRepair/wiki/Using
plex_repair_options:
  - 'stop'
  - 'check'
  - 'repair'
  - 'reindex'
  - 'prune'
  - 'deflate'
  - 'start'
  - 'exit'
